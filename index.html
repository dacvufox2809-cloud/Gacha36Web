<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SAY GEX</title>
    <style>
        body {
            background-image: url('nanachi.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffd700;
            font-size: 3.5em;
            text-transform: uppercase;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }
        .button-group {
            display: flex;
            gap: 25px;
            margin-bottom: 15px;
        }
        button {
            padding: 20px 40px;
            font-size: 1.4em;
            cursor: pointer;
            background: linear-gradient(135deg, #4c2c69, #7a4f9a);
            color: white;
            border: 2px solid #5a3a79;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #7a4f9a, #4c2c69);
            transform: translateY(-4px);
        }

        /* Nút xem túi đồ riêng biệt */
        .btn-inventory {
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            border: 2px solid #388e3c;
        }
        .btn-inventory:hover {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
        }

        /* ================= HOẠT ẢNH NỔ GACHA ================= */
        .gacha-screen, .inventory-screen {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 3★: Chớp sáng xanh lam */
        .flash-blue {
            animation: animationXanh 0.6s ease-out forwards;
        }
        /* 4★ MỚI: Chớp sáng tím lãng mạn quý phái */
        .flash-purple {
            animation: animationTim 0.8s ease-out forwards;
        }
        /* 5★: Chớp sáng vàng kim chí mạng */
        .flash-gold {
            animation: animationVang 1s ease-out forwards;
        }

        @keyframes animationXanh {
            0% { background-color: #ffffff; box-shadow: inset 0 0 100px #00a2ff; }
            40% { background-color: #0044ff; }
            100% { background-color: rgba(10, 10, 15, 0.95); }
        }

        @keyframes animationTim {
            0% { background-color: #ffffff; box-shadow: inset 0 0 100px #cc00ff; }
            40% { background-color: #9900cc; }
            100% { background-color: rgba(12, 5, 18, 0.96); }
        }

        @keyframes animationVang {
            0% { background-color: #ffffff; box-shadow: inset 0 0 100px #ffcc00; }
            45% { background-color: #ffaa00; }
            100% { background-color: rgba(15, 10, 5, 0.97); }
        }

        /* Chữ hiển thị vật phẩm bay ra */
        .item-result {
            font-size: 2.2em;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
            opacity: 0;
            transform: scale(0.7);
            animation: hienChu 0.4s 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes hienChu {
            to { opacity: 1; transform: scale(1); }
        }

        .btn-close {
            margin-top: 40px;
            padding: 10px 30px;
            font-size: 1em;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            opacity: 0;
            animation: hienChu 0.4s 1s ease-out forwards;
        }

        /* ================= GIAO DIỆN TÚI ĐỒ ================= */
        .inventory-screen {
            background-color: rgba(10, 10, 15, 0.98);
            z-index: 100;
        }
        .inventory-box {
            width: 80%;
            max-width: 600px;
            background: #1a1a24;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .inventory-title {
            color: #ffcc00;
            font-size: 2em;
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .inventory-list {
            max-height: 350px;
            overflow-y: auto;
            margin: 20px 0;
            padding-right: 10px;
        }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid #2a2a3a;
        }
        .inventory-list::-webkit-scrollbar { width: 8px; }
        .inventory-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>say gex banner</h1>
    
    <div class="button-group">
        <button onclick="quayGacha(1)">Quay x1</button>
        <button onclick="quayGacha(10)">Quay x10</button>
    </div>

    <!-- NÚT MỚI: Xem túi đồ -->
    <div class="button-group">
        <button class="btn-inventory" onclick="moTuiDo()">Check Inventory</button>
    </div>

    <!-- Màn hình hiệu ứng gacha -->
    <div id="screen-gacha" class="gacha-screen">
        <div id="text-result" class="item-result"></div>
        <button class="btn-close" onclick="dongManHinh()">Skip</button>
    </div>

    <!-- MÀN HÌNH TÚI ĐỒ -->
    <div id="screen-inventory" class="inventory-screen">
        <div class="inventory-box">
            <h2 class="inventory-title">KHO VẬT PHẨM ĐÃ QUAY</h2>
            <div id="inventory-list" class="inventory-list"></div>
            <div style="text-align: center;">
                <button class="btn-close" style="opacity: 1; animation: none;" onclick="dongTuiDo()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Kho dữ liệu vật phẩm giữ nguyên của bạn
        const kho5Sao = ["★5 Nguyễn Minh Cường", "★5 Lọ Mọ", "★5 Bao Cao Su", "★5 Kiều Lương tâm"];
        const kho4Sao = ["★4 Ốp Điện Thoại", "★4 Lốp", "★4 Ma Dog", "★4 Coăn Bọa"]; 
        const kho3Sao = ["★3 Fat Nigger", "★3 Warter Melon", "★3 Rượu Kích Dục Của Mẹ Lý", "★3 Lá Chanh", "★3 Cứt"];

        // Biến lưu trữ vật phẩm trong túi đồ
        let tuiDo = {};

        const manHinhGacha = document.getElementById('screen-gacha');
        const vungHienThiChu = document.getElementById('text-result');
        const manHinhTuiDo = document.getElementById('screen-inventory');
        const vungDanhSachTui = document.getElementById('inventory-list');

        // Hàm tính toán tỉ lệ ngẫu nhiên 0.5%
        function rollItem() {
            let mayMan = Math.random() * 100; 
            
            if (mayMan <= 0.5) { 
                let item = kho5Sao[Math.floor(Math.random() * kho5Sao.length)];
                return { name: item, rarity: 5 };
            } else if (mayMan <= 25.5) { 
                let item = kho4Sao[Math.floor(Math.random() * kho4Sao.length)];
                return { name: item, rarity: 4 };
            } else {
                let item = kho3Sao[Math.floor(Math.random() * kho3Sao.length)];
                return { name: item, rarity: 3 };
            }
        }

        function quayGacha(soLuot) {
            let mangKetQua = [];
            let doHiemCaoNhat = 3; 

            for (let i = 0; i < soLuot; i++) {
                let ketQuaRoll = rollItem();
                
                // CẬP NHẬT TÚI ĐỒ: Nếu có rồi thì tăng số lượng, chưa có thì thêm mới
                if (tuiDo[ketQuaRoll.name]) {
                    tuiDo[ketQuaRoll.name].count += 1;
                } else {
                    tuiDo[ketQuaRoll.name] = { count: 1, rarity: ketQuaRoll.rarity };
                }

                if (ketQuaRoll.rarity > doHiemCaoNhat) {
                    doHiemCaoNhat = ketQuaRoll.rarity;
                }

                if (ketQuaRoll.rarity === 5) {
                    mangKetQua.push(`<span style="color: #ffd700; text-shadow: 0 0 15px #ffd700;">${ketQuaRoll.name}</span>`);
                } else if (ketQuaRoll.rarity === 4) {
                    mangKetQua.push(`<span style="color: #e100ff; text-shadow: 0 0 10px #e100ff;">${ketQuaRoll.name}</span>`);
                } else {
                    mangKetQua.push(`<span style="color: #00ccff;">${ketQuaRoll.name}</span>`);
                }
            }

            manHinhGacha.className = "gacha-screen"; 
            if (doHiemCaoNhat === 5) {
                manHinhGacha.classList.add('flash-gold'); 
            } else if (doHiemCaoNhat === 4) {
                manHinhGacha.classList.add('flash-purple'); 
            } else {
                manHinhGacha.classList.add('flash-blue'); 
            }

            vungHienThiChu.innerHTML = mangKetQua.join('<br>');
            manHinhGacha.style.display = 'flex';
        }

        // Hàm xử lý mở giao diện túi đồ
        function moTuiDo() {
            vungDanhSachTui.innerHTML = ''; 
            
            if (Object.keys(tuiDo).length === 0) {
                vungDanhSachTui.innerHTML = '<p style="text-align:center; color:#aaa; font-size:1.2em;">Túi đồ trống rỗng... Hãy quay gacha để tích lũy!</p>';
            } else {
                for (let tenVatPham in tuiDo) {
                    let thongTinItem = tuiDo[tenVatPham];
                    let mauSac = '#00ccff'; 
                    
                    if (thongTinItem.rarity === 5) mauSac = '#ffd700'; 
                    else if (thongTinItem.rarity === 4) mauSac = '#e100ff'; 

                    vungDanhSachTui.innerHTML += `
                        <div class="inventory-item" style="color: ${mauSac}">
                            <span>${tenVatPham}</span>
                            <span>x${thongTinItem.count}</span>
                        </div>
                    `;
                }
            }
            manHinhTuiDo.style.display = 'flex';
        }

        function dongTuiDo() {
            manHinhTuiDo.style.display = 'none';
        }

        function dongManHinh() {
            manHinhGacha.style.display = 'none';
        }
    </script>
</body>
</html>
