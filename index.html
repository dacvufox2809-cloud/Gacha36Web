<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SAY GEX</title>
    <style>
        body {
            background-image: url('nanachi.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffd700;
            font-size: 3.5em;
            text-transform: uppercase;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }
        .button-group {
            display: flex;
            gap: 25px;
        }
        button {
            padding: 20px 40px;
            font-size: 1.4em;
            cursor: pointer;
            background: linear-gradient(135deg, #4c2c69, #7a4f9a);
            color: white;
            border: 2px solid #5a3a79;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #7a4f9a, #4c2c69);
            transform: translateY(-4px);
        }

        /* ================= HOẠT ẢNH NỔ GACHA ================= */
        .gacha-screen {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 3★: Chớp sáng xanh lam */
        .flash-blue {
            animation: animationXanh 0.6s ease-out forwards;
        }
        /* 4★ MỚI: Chớp sáng tím lãng mạn quý phái */
        .flash-purple {
            animation: animationTim 0.8s ease-out forwards;
        }
        /* 5★: Chớp sáng vàng kim chí mạng */
        .flash-gold {
            animation: animationVang 1s ease-out forwards;
        }

        @keyframes animationXanh {
            0% { background-color: #ffffff; box-shadow: inset 0 0 100px #00a2ff; }
            40% { background-color: #0044ff; }
            100% { background-color: rgba(10, 10, 15, 0.95); }
        }

        @keyframes animationTim {
            0% { background-color: #ffffff; box-shadow: inset 0 0 100px #cc00ff; }
            40% { background-color: #9900cc; }
            100% { background-color: rgba(12, 5, 18, 0.96); }
        }

        @keyframes animationVang {
            0% { background-color: #ffffff; box-shadow: inset 0 0 100px #ffcc00; }
            45% { background-color: #ffaa00; }
            100% { background-color: rgba(15, 10, 5, 0.97); }
        }

        /* Chữ hiển thị vật phẩm bay ra */
        .item-result {
            font-size: 2.2em;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
            opacity: 0;
            transform: scale(0.7);
            animation: hienChu 0.4s 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes hienChu {
            to { opacity: 1; transform: scale(1); }
        }

        .btn-close {
            margin-top: 40px;
            padding: 10px 30px;
            font-size: 1em;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            opacity: 0;
            animation: hienChu 0.4s 1s ease-out forwards;
        }
    </style>
</head>
<body>

    <h1>say gex banner</h1>
    
    <div class="button-group">
        <button onclick="quayGacha(1)">Quay x1</button>
        <button onclick="quayGacha(10)">Quay x10</button>
    </div>

    <div id="screen-gacha" class="gacha-screen">
        <div id="text-result" class="item-result"></div>
        <button class="btn-close" onclick="dongManHinh()">Bỏ qua</button>
    </div>

    <script>
        // Kho dữ liệu vật phẩm
        const kho5Sao = ["★5 Nguyễn Minh Cường", "★5 Lọ Mọ", "★5 Bao Cao Su"];
        const kho4Sao = ["★4 Ốp Điện Thoại", "★4 Lốp", "★4 Ma Dog", "★4 Coăn Bọa"]; // Thêm kho 4 sao
        const kho3Sao = ["★3 Fat Nigger", "★3 Warter Melon", "★3 Rượu Kích Dục Của Mẹ Lý", "★3 Lá Chanh", "★3 Cứt"];

        const manHinhGacha = document.getElementById('screen-gacha');
        const vungHienThiChu = document.getElementById('text-result');

        // Hàm tính toán tỉ lệ ngẫu nhiên
        function rollItem() {
            let mayMan = Math.floor(Math.random() * 100) + 1;
            
            if (mayMan <= 1) { 
                // 10% cơ hội ra 5 sao
                let item = kho5Sao[Math.floor(Math.random() * kho5Sao.length)];
                return { name: item, rarity: 5 };
            } else if (mayMan <= 20) { 
                // 25% cơ hội ra 4 sao (từ số 11 đến 35)
                let item = kho4Sao[Math.floor(Math.random() * kho4Sao.length)];
                return { name: item, rarity: 4 };
            } else {
                // 65% còn lại ra đồ thường 3 sao
                let item = kho3Sao[Math.floor(Math.random() * kho3Sao.length)];
                return { name: item, rarity: 3 };
            }
        }

        function quayGacha(soLuot) {
            let mangKetQua = [];
            let doHiemCaoNhat = 3; // Mặc định thấp nhất là 3 sao

            for (let i = 0; i < soLuot; i++) {
                let ketQuaRoll = rollItem();
                
                // Cập nhật độ hiếm cao nhất có trong lượt quay này
                if (ketQuaRoll.rarity > doHiemCaoNhat) {
                    doHiemCaoNhat = ketQuaRoll.rarity;
                }

                // Định dạng màu sắc chữ hiển thị ứng với số sao
                if (ketQuaRoll.rarity === 5) {
                    mangKetQua.push(`<span style="color: #ffd700; text-shadow: 0 0 15px #ffd700;">${ketQuaRoll.name}</span>`);
                } else if (ketQuaRoll.rarity === 4) {
                    mangKetQua.push(`<span style="color: #e100ff; text-shadow: 0 0 10px #e100ff;">${ketQuaRoll.name}</span>`);
                } else {
                    mangKetQua.push(`<span style="color: #00ccff;">${ketQuaRoll.name}</span>`);
                }
            }

            // Kích hoạt hiệu ứng chớp màu dựa trên món đồ xịn nhất quay được
            manHinhGacha.className = "gacha-screen"; // Reset class
            if (doHiemCaoNhat === 5) {
                manHinhGacha.classList.add('flash-gold'); // Ưu tiên nổ vàng
            } else if (doHiemCaoNhat === 4) {
                manHinhGacha.classList.add('flash-purple'); // Không có 5 sao thì nổ tím
            } else {
                manHinhGacha.classList.add('flash-blue'); // Chỉ toàn 3 sao thì nổ xanh
            }

            vungHienThiChu.innerHTML = mangKetQua.join('<br>');
            manHinhGacha.style.display = 'flex';
        }

        function dongManHinh() {
            manHinhGacha.style.display = 'none';
        }
    </script>
</body>
</html>
